[project]
name = "decisions"
version = "0.1.0"
description = "General-purpose decision log: agents and apps create decisions via REST, a human resolves them in a GUI, webhooks fire."
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
decide = "decisions.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["decisions"]

[tool.setuptools.package-data]
decisions = ["static/*", "skill/*", ".commit"]
